name: CI

# Unit tests and the end-to-end selftest against goose's latest CLI release and the release
# goose-triggers was last checked with. The daily run tests each new goose release as it
# comes out. The selftest uses goose-triggers' scripted model server: no API key, no secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (goose ${{ matrix.goose }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goose: [latest, v1.57.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools libdbus-1-3 libxcb1

      - name: Install the goose CLI (${{ matrix.goose }})
        env:
          WANT: ${{ matrix.goose }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$WANT" = latest ]; then
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/aaif-goose/goose/releases/latest | jq -r .tag_name)
          else
            tag="$WANT"
          fi
          echo "goose release: $tag"
          curl -fsSL -o "$RUNNER_TEMP/goose.tar.bz2" \
            "https://github.com/aaif-goose/goose/releases/download/$tag/goose-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p "$RUNNER_TEMP/goose" "$HOME/.local/bin"
          tar -xjf "$RUNNER_TEMP/goose.tar.bz2" -C "$RUNNER_TEMP/goose"
          find "$RUNNER_TEMP/goose" -name goose -type f -exec install -m 755 {} "$HOME/.local/bin/goose" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/goose" --version

      - name: Unit tests and the selftest (cargo test)
        run: cargo test --locked

      - name: Static release build (musl)
        run: |
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --locked --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/goose-triggers

      - name: Selftest with the release binary
        run: target/x86_64-unknown-linux-musl/release/goose-triggers selftest

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format and lints
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Builds with the minimum Rust version (1.85)
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 build --locked
