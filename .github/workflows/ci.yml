name: CI

# Unit tests, the end-to-end selftest and the hostile-event suite against goose's latest CLI
# release and the release goose-triggers was last checked with. The daily run tests each new
# goose release as it comes out. Both use goose-triggers' scripted model server: no API key,
# no secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (goose ${{ matrix.goose }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goose: [latest, v1.57.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and musl
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools libdbus-1-3 libxcb1

      - name: Find the goose CLI release (${{ matrix.goose }})
        id: goose
        env:
          WANT: ${{ matrix.goose }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$WANT" = latest ]; then api=releases/latest; else api="releases/tags/$WANT"; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/aaif-goose/goose/$api" > "$RUNNER_TEMP/release.json"
          tag=$(jq -er .tag_name "$RUNNER_TEMP/release.json")
          digest=$(jq -er '.assets[] | select(.name == "goose-x86_64-unknown-linux-gnu.tar.bz2") | .digest' "$RUNNER_TEMP/release.json")
          echo "goose release: $tag ($digest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Install the goose CLI (${{ steps.goose.outputs.tag }})
        env:
          TAG: ${{ steps.goose.outputs.tag }}
          SHA256: ${{ steps.goose.outputs.sha256 }}
          # goose 1.57.0's Linux x86-64 tarball, checked when goose-triggers was tested with it.
          SHA256_1_57_0: e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d
        run: |
          set -euo pipefail
          if [ "$TAG" = v1.57.0 ] && [ "$SHA256" != "$SHA256_1_57_0" ]; then
            echo "goose v1.57.0's release lists another checksum than the one pinned here" >&2
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/goose.tar.bz2" \
            "https://github.com/aaif-goose/goose/releases/download/$TAG/goose-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$SHA256  $RUNNER_TEMP/goose.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/goose" "$HOME/.local/bin"
          tar -xjf "$RUNNER_TEMP/goose.tar.bz2" -C "$RUNNER_TEMP/goose"
          find "$RUNNER_TEMP/goose" -name goose -type f -exec install -m 755 {} "$HOME/.local/bin/goose" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/goose" --version

      - name: Unit tests and the selftest (cargo test)
        run: cargo test --locked

      - name: Static release build (musl)
        run: |
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --locked --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/goose-triggers

      - name: Selftest with the release binary
        run: target/x86_64-unknown-linux-musl/release/goose-triggers selftest

      - name: Hostile-event suite with the release binary
        run: target/x86_64-unknown-linux-musl/release/goose-triggers hostile-suite

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format and lints
        run: |
          # A fixed toolchain, so that new lints arrive with a deliberate change, not overnight.
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Builds with the minimum Rust version (1.85)
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 build --locked
