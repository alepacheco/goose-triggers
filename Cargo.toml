[package]
name = "goose-triggers"
version = "0.0.5"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Event-driven background runs for goose, with approval holds"
repository = "https://github.com/alepacheco/goose-triggers"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.50", features = ["derive"] }
glob = "0.3.3"
libc = "0.2.177"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
tiny_http = "0.12.0"

[profile.release]
lto = "thin"
strip = true
